name: Entreprenur News Production CD

on:
  push:
    branches: [primetv]

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate .env
        run: |
          envsubst "`printf '${%s} ' $(sh -c "env|cut -d'=' -f1")`" < ./environments/example.env > ./environments/$NODE_ENV.env
        env:
          PORT: 5005
          NODE_ENV: production
          API_PREFIX: api/v1
          TZ: UTC

          # Swagger
          API_VERSION: 1.0.0
          API_TITLE: Prime TV API PRODUCTION
          API_DESCRIPTION: Prime TV API PRODUCTION

          # Default DB
          DB_TYPE: postgres
          DB_HOST: ${{ secrets.PRODUCTION_HOST }}
          DB_PORT: 5432
          DB_USERNAME: ${{ secrets.PRODUCTION_POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASS }}
          DB_DATABASE: secure-prime-tv_db-prod
          DB_SYNCHRONIZE: true
          DB_LOGGING: false

          # Security
          CORS_ALLOWED_ORIGINS: https://api.theprimetv.com,https://panel.theprimetv.com,https://theprimetv.com
          RATE_LIMIT_TTL: 30000
          RATE_LIMIT_MAX: 500

          # Logger
          LOG_FOLDER: logs

          # JWT
          JWT_SECRET: ssh-rsa CCCAB3NzaC1yc2ECCCdwADAQABAAwdwwABAQfC8kf3x3Wi9V3kMkYu9tjDwdwaTSV2cBjOgp3FQwdwU/Gndlced9WsaVNx3lgkbbS47sPpFMdQVSgemGbRqhaj9vUrD56+QOMn5HuxeAp5VMwwD$
          JWT_SALT_ROUNDS: 10
          JWT_EXPIRES_IN: 2h
          JWT_REFRESH_TOKEN_EXPIRES_IN: 6h

          # S3
          S3_ENDPOINT: sgp1.digitaloceanspaces.com
          S3_ACCESS_KEY: DO00XZBXH4KYVER4W6KU
          S3_SECRET_KEY: /1XSF2y/F3fH/bwoXJB7jDSdka5j1PZCBCcl2YPjt4E
          S3_BUCKET: quickspace
          S3_FOLDER_PREFIX: primetv

          # Auth
          OTP_EXPIRES_IN: 5000

          WEB_PANEL_LOGIN_LINK: https://theprimetv.com/auth/login
          INTERNAL_PANEL_LOGIN_LINK: https://panel.theprimetv.com/auth/login

          # Seed Database
          SUPER_ADMIN_EMAIL: superadmin@theprimetv.com
          SUPER_ADMIN_PASSWORD: boss@Prime

          #QUEUE
          QUEUE_HOST: redis
          QUEUE_PORT: 6379
          QUEUE_PASSWORD: PiTech.domanaged#redis

          # Cache
          CACHE_TTL: 60
          CACHE_MAX: 100
          CACHE_STORE_HOST: redis
          CACHE_STORE_PORT: 6379
          CACHE_STORE_PASSWORD: PiTech.domanaged#redis
          CACHE_STORE_USERNAME: default

          #SMTP
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: 2525
          SMTP_SECURE: false
          SMTP_AUTH_USER: 7d808e001@smtp-brevo.com
          SMTP_AUTH_PASS: 4EGZfv5jk9tCcKJr
          SMTP_EMAIL: no-reply@theprimetv.com

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Build the project
        run: yarn run build
        env:
          CI: false

      - name: Deploy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.PRODUCTION_SERVER_SSH_PRIVATE_KEY }}
          rm: true
          source: './' # This will send all files, including the build directory
          target: '/home/pitech/deployed-services/primetv-api-prod/' # This will send all files, including the build directory
          strip_components: 0

  deploy-primetv-api-prod-to-DO:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy api to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.PRODUCTION_SERVER_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/pitech/deployed-services/primetv-api-prod/
            echo "calling shutdown endpoint..."
            docker stop primetv-api-prod || true
            docker rm primetv-api-prod || true

            echo "Building the image..."
            docker build -t primetv-api-prod:local -f /home/pitech/deployed-services/primetv-api-prod/Dockerfile.primetv.prod .

            echo "starting server instance..."
            docker run -e NODE_ENV=production -d \
              --restart always \
              -dit --name primetv-api-prod --network docker_docker_net \
              -p 0.0.0.0:5005:5005 \
              --name primetv-api-prod \
              -v /home/pitech/deployed-services/primetv-api-prod/dist:/app/dist \
              primetv-api-prod:local

            docker builder prune -f
            docker image prune -f
            echo "Deploy Done...."
